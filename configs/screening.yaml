# model screening.

defaults:
  n_trials: 10

# Overlap the CPU lane with the GPU lane's CV stages (models within a lane
# still run serially: CPU models each use every core, GPU models share a slot).
parallel: true

plot_models:
  - similarity
  - logreg_morgan2048
  - rf_morgan2048
  - lgbm_morgan2048
  - tabpfn_morgan2048

representation_plot_models: null

datasets:
  - GNEtolC
models:
  similarity:
    env: brood
  logreg_morgan2048:
    env: brood
    model: logreg
    representation: morgan2048
  rf_morgan2048:
    env: brood
    model: rf
    representation: morgan2048
  lgbm_morgan2048:
    env: brood
    model: lgbm
    representation: morgan2048
  tabpfn_morgan2048:
    env: tabpfn
    model: tabpfn
    representation: morgan2048
    gpu: 0